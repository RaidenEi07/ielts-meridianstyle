spring.application.name=meridian-backend

# Cho phep bo trong field primitive (int/boolean) -> nhan gia tri mac dinh
spring.jackson.deserialization.fail-on-null-for-primitives=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meridian}
spring.datasource.username=${DB_USER:meridian}
spring.datasource.password=${DB_PASSWORD:meridian}

# schema is owned by Flyway, never by Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=${SERVER_PORT:8090}
server.error.include-message=always
server.error.include-binding-errors=always

# --- Application-specific configuration ---
# 256-bit secret (base64 hoac plain). Override qua bien moi truong khi production.
meridian.jwt.secret=${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key-0123456789}
meridian.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL:900}
meridian.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TTL:1209600}
meridian.jwt.issuer=meridian
meridian.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3100,http://192.168.1.7:3100}
meridian.distribution.allow-private-targets=${DISTRIBUTION_ALLOW_PRIVATE_TARGETS:false}
# false = deployment thật (vd web con của khách): chỉ tạo admin, không tạo giáo viên/khóa học/câu hỏi mẫu (có mật khẩu mặc định).
meridian.seed-demo-data=${SEED_DEMO_DATA:true}
# Giới hạn tần suất theo IP cho endpoint công khai (xem RateLimitFilter); 429 khi vượt.
meridian.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
meridian.rate-limit.inquiries-per-hour=${RATE_LIMIT_INQUIRIES_PER_HOUR:10}
meridian.rate-limit.register-per-hour=${RATE_LIMIT_REGISTER_PER_HOUR:30}
meridian.rate-limit.login-per-five-minutes=${RATE_LIMIT_LOGIN_PER_5MIN:200}
# Gửi HSTS cả khi proxy không chuyển tiếp X-Forwarded-Proto (mặc định: chỉ khi request đến qua HTTPS).
meridian.security.force-hsts=${FORCE_HSTS:false}
meridian.uploads.dir=${UPLOADS_DIR:uploads}
meridian.uploads.public-base-url=${UPLOADS_PUBLIC_BASE_URL:http://localhost:8090}

spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

logging.level.org.flywaydb=info
logging.level.com.meridian=debug
